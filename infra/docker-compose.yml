# GPU host (make up). Weights live in ${PETPOP_MODELS:-/srv/models}, mounted read-only.
# The worker image bundles bpy, so the Blender stages run as subprocesses of the worker with CUDA.
name: petpop
x-app: &app
  build: { context: .., dockerfile: infra/Dockerfile.app }
  env_file: ../.env
  environment:
    PETPOP_MODE: real
    DATABASE_URL: postgresql+psycopg://petpop:${POSTGRES_PASSWORD}@postgres:5432/petpop
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    COMFY_URL: http://comfyui:8188
    OLLAMA_URL: http://ollama:11434
  volumes:
    - fulfilment:/var/petpop/fulfilment
  depends_on: [postgres, redis, minio]

services:
  api:
    <<: *app
    ports: ["${API_PORT:-8000}:8000"]
    restart: unless-stopped

  worker:
    <<: *app
    command: ["arq", "backend.worker.arq_worker.WorkerSettings"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  comfyui:
    build: { context: .., dockerfile: infra/Dockerfile.comfyui }
    expose: ["8188"]          # reachable by the worker only
    volumes:
      - ${PETPOP_MODELS:-/srv/models}:/opt/ComfyUI/models:ro
      - ../pipelines/comfy/extra_model_paths.yaml:/opt/ComfyUI/extra_model_paths.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  ollama:
    image: ollama/ollama:0.4.7
    expose: ["11434"]
    volumes:
      - ${PETPOP_MODELS:-/srv/models}/ollama:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: petpop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: petpop
    volumes: [pg:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio:/data]
    restart: unless-stopped

volumes:
  pg: {}
  minio: {}
  fulfilment: {}
