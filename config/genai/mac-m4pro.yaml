# GenAI profile: mac-m4pro. Prototype GenAI host: Apple Silicon M4 Pro, 24 GB unified memory, PyTorch MPS.
# ComfyUI (SDXL txt2img concept, MV-Adapter views, BiRefNet matting, Hunyuan3D-2mv shape), a Hunyuan3D-2.1
# shape server on the MPS fork (single-view fallback and the fast path) and Ollama run natively on the Mac
# (see mac/). The VM reaches them through mac/tunnel.sh. One resident model at a time: every call unloads after
# itself. Library path about 30 min per pet, fast path (bespoke jobs) about 15 min; no latency target.
# Settings measured in the S3 sweeps (docs/s3, decisions 86 to 102).
profile: mac-m4pro
version: 3
description: Apple Silicon prototype host. All GenAI on MPS, one resident model at a time; library path ~30 min, fast path ~15 min per pet.
host: {kind: apple-silicon, accelerator: mps, memory_gb: 24}
mode: real

quality:
  default: mac
  presets:
    mac: {concept_px: 1024, view_px: 768, control_px: 512, samples: 16, albedo_px: 2048, voxel_mm: 0.25, print_tris: 250000, turntable_frames: 36, turntable_px: 512, mask_px: 2048}
    test: {concept_px: 768, view_px: 512, control_px: 512, samples: 4, albedo_px: 1024, voxel_mm: 0.5, print_tris: 60000, turntable_frames: 8, turntable_px: 128, mask_px: 1024}

timeouts_s: {A: 15, control: 120, B: 300, C: 900, D: 1800, E: 240, F: 480}
# Measured on the Mac 2026-10-30: concept 80-125 s, MV-Adapter 280-630 s plus five BiRefNet mattes, 2mv full at
# octree 256 1191-1347 s (the fast path's Hunyuan3D-2.1 single view: about 345 s).
expected_s: {A: 4, control: 10, B: 110, C: 360, D: 1250, E: 30, F: 90, total: [1700, 2300]}
latency: {target_s: null, enforce: false}   # waived on the prototype host

residency:
  max_resident_models: 1
  free_comfy_after_call: true       # POST /free {unload_models} after every ComfyUI prompt
  ollama_keep_alive_s: 0             # Ollama unloads the LLM right after each parse
  shape_unload_after_call: true      # the shape server drops Hunyuan3D after each mesh

services:
  comfy:  {env: COMFY_URL,  default: "http://127.0.0.1:8188"}
  shape:  {env: SHAPE_URL,  default: "http://127.0.0.1:8190"}
  ollama: {env: OLLAMA_URL, default: "http://127.0.0.1:11434"}
  embed:  {env: EMBED_URL,  default: "http://127.0.0.1:8190"}   # served by the shape server's process for now
  auth_token_env: GENAI_TOKEN        # bearer token checked by the Mac's tunnel proxy

parser:
  backend: ollama
  service: ollama
  model: qwen2.5:7b-instruct-q4_K_M
  timeout_s: 3                       # Section 6.1; first call after unload may miss it and fall back to rules
  temperature: 0

image:
  backend: comfy
  service: comfy
  # Concept: plain txt2img (decision 86). Views: MV-Adapter from the concept (decisions 88, 95, 96, 102).
  # The per-view graph (02_views_ipadapter.json, with ipadapter/clip_vision/controlnet_depth) still runs if named here.
  workflows: {concept: 01b_concept_txt2img.json, views: 02b_views_mvadapter.json, matte: 05_matte_birefnet.json}
  lora_trigger: petpop_style                    # dropped from the prompt while lora is null
  models:
    checkpoint: sd_xl_base_1.0.safetensors
    vae: sdxl_vae_fp16_fix.safetensors          # fp16-safe VAE (the SDXL VAE produces NaNs in fp16 on MPS)
    controlnet_depth: controlnet-depth-sdxl-1.0.fp16.safetensors
    ipadapter: ip-adapter-plus_sdxl_vit-h.safetensors
    clip_vision: CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors
    lora: null                                   # petpop_style_v1.safetensors once trained (S4)
    # MV-Adapter loads diffusers folders by path, relative to ComfyUI's directory (mac/setup.sh links petpop-models)
    mv_base: petpop-models/diffusers/stable-diffusion-xl-base-1.0
    mv_vae: petpop-models/diffusers/sdxl-vae-fp16-fix
    mv_adapter_repo: petpop-models/hf/huanngzh/mv-adapter
    mvadapter: mvadapter_i2mv_sdxl.safetensors
    bg_removal: birefnet.safetensors             # ComfyUI core background removal (decision 98)
  params: {concept_steps: 25, view_steps: 25, cfg: 6.0, sampler: dpmpp_2m, scheduler: karras, controlnet_strength: 0.7, init_denoise: 0.7, ipadapter_weight: 0.7, lora_strength: 0.8, mv_steps: 30, mv_cfg: 3.0}
  precision: {unet: fp16, vae: fp16}
  matting: {method: birefnet}

shape:
  # Hunyuan3D-2mv full through ComfyUI's core nodes on the four views (decisions 89, 98, 101: surface-net meshing,
  # turbo not adopted), octree 256 as measured. The single-view fallback, and the whole of the fast path, is
  # Hunyuan3D-2.1 on the shape server at the fork's measured octree 192.
  backend: comfy
  service: comfy
  views: [front, left, back, right]
  workflows: {multiview: 03_shape_hy2mv.json}
  models: {multiview: hunyuan3d-dit-v2-mv.fp16.safetensors}
  params: {octree_resolution: 256, steps: 50, guidance: 5.5, num_chunks: 8000, latent_resolution: 3072, threshold: 0.6, sampler: euler, scheduler: normal, mesh_algorithm: surface net}
  fallback:
    backend: http
    service: shape
    model: tencent/Hunyuan3D-2.1/hunyuan3d-dit-v2-1
    seed_offset: 1
    params: {octree_resolution: 192, steps: 30, guidance: 7.5, num_chunks: 8000}
  orientation: {yaw_deg: 0}
  height_mm: 90
  max_tris: 300000
  iou_min: 0.85
  server:                            # read by mac/shape_server on the Mac, not by the VM
    engine: hunyuan3d-2.1-mps
    code_dir_env: HY3D_DIR           # checkout of VladimirTalyzin/hunyuan3d-2.1-mac (pinned)
    code_paths: [".", Hunyuan3D-2.1, Hunyuan3D-2.1/hy3dshape]   # fork, then Tencent's code inside it (pinned)
    compat: hunyuan3d-2.1-mac        # load the fork's backend + compat_patches before torch
    module: hy3dshape.pipelines
    class: Hunyuan3DDiTFlowMatchingPipeline
    repo: tencent/Hunyuan3D-2.1      # loaded from <PETPOP_MODELS>/hf/<repo>, never from the Hub
    subfolder: hunyuan3d-dit-v2-1
    variant: fp16
    device: mps
    dtype: float16
    env: {HY3D_BACKEND: mps, HY3D_DTYPE: float16, HF_HUB_OFFLINE: "1", PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0", PYTORCH_ENABLE_MPS_FALLBACK: "1"}

# Image embeddings for evaluation (view consistency, best-of-N, LoRA curation, library search): POST <embed>/v1/embed.
# For now the shape server's process serves it, sharing its one-model-at-a-time slot.
embed:
  service: embed                     # its own address, so it can move to its own process without client changes
  model: facebook/dinov2-large
  repo: facebook/dinov2-large        # loaded from <PETPOP_MODELS>/hf/<repo>, never from the Hub
  device: mps
  dtype: float16
  wait_s: 30                         # wait this long for a running mesh, then answer 409

# Pipelines (decisions 104, 114): multiview by default (MV-Adapter views, Hunyuan3D-2mv, about 30 min); single
# view shapes from the front alone on the shape server (Hunyuan3D-2.1, about 15 min) and is what the kiosk's
# bespoke jobs use. Studio can pick either per job.
paths:
  default: multiview
  by_kind: {bespoke: single_view}
  multiview: {title: Multiview, views: generate, shape: multiview, note: "MV-Adapter views -> Hunyuan3D-2mv"}
  single_view: {title: Single view, views: generate, shape: single_view, note: "Hunyuan3D-2.1 from the front view"}

texture:
  backend: projection                # Blender camera projection of the four views; Hunyuan3D-Paint is NVIDIA-only
  allowed: [projection, flat]
  projection: {view_weight_power: 2.0, seam_pad_px: 2, colour_correct: true}

gates: {iou_min: 0.85, p50_s: null, max_s: null}
