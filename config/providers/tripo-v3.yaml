# Provider manifest: Tripo3D apiv3. Everything the pipeline needs to know about this vendor's wire format lives
# here (data/schema/provider-manifest.schema.json); backend/worker/providers/manifest.py executes it. To move to an
# equivalent API, write its manifest and point a GenAI profile at it; to build your own GenAI API, implement a wire
# format a manifest can describe (docs/PROVIDERS.md). Source: Tripo's Python SDK 1.0.0 (2026-10-14), which wraps
# this API; checked against the live endpoints for auth errors only (no key in the VM yet).
manifest: tripo-v3
version: 1
vendor: Tripo3D
docs: https://platform.tripo3d.ai/docs
auth: {scheme: bearer, header: Authorization}
envelope:
  code: code                 # every JSON answer: {"code": 0, "data": {...}} on success
  ok: [0]
  data: data
  message: [message, suggestion]
licence:
  # Tripo grants private generation and commercial use per account plan (subscribers: private, full commercial
  # rights; free plan: public, CC BY 4.0). No request flag is documented in SDK 1.0.0; if one is, add it to
  # create_extras so every generation request carries it.
  private: account
  commercial: account
create_extras: {}
upload:
  route: POST /v3/files
  form_field: file
  token: file_token
tasks:
  id: task_id
  poll: GET /v3/tasks/{task_id}
  status: status
  progress: progress
  success: [success]
  failed: [failed, cancelled, banned, expired]
  credits: credits_consumed
  error: [error_code, error_msg]
  output: output
balance: GET /v3/account/balance
capabilities:
  text_to_image:
    route: POST /v3/generation/text-to-image
    body: {prompt: $prompt, negative_prompt: $negative}
    result: [generated_image_url, generated_image, image_url, image]
    manual:
      title: Concept image (Tripo text to image)
      steps:
        - In Tripo Studio, open image generation (text to image).
        - Paste the prompt; paste the negative prompt if the tool has a field for it.
        - Use the settings below where Tripo Studio offers them (a square image if it asks for a size).
        - Generate, pick the image that best matches the prompt, and download it (PNG, JPG or WebP).
        - Upload it here. The job continues to the 3D model step.
  image_to_model:
    route: POST /v3/generation/image-to-model
    body: {input: $image}
    rename: {model_version: model}
    seeds: [model_seed, texture_seed]
    result: [model_url, model, pbr_model_url, pbr_model, base_model_url, base_model]
    manual:
      title: 3D model from the concept (Tripo image to 3D)
      steps:
        - Download the input image below (the matted concept).
        - In Tripo Studio, open image to 3D and upload that image.
        - Match the settings below where Tripo Studio offers them (model version, texture on, texture quality, PBR, face limit); keep private generation on.
        - Generate, then download the model as GLB with its texture.
        - Upload the GLB here. The job continues with the wrap, texture and print files.
  image_to_multiview:
    route: POST /v3/generation/image-to-multiview
    body: {input: $image}
    # The SDK 1.0.0 reads the views from output.generate_multiview_image.*_view_url; top-level names as fallback.
    # Which side Tripo calls "left" (the pet's or the camera's) is to be checked on the first real job.
    results:
      front: [generate_multiview_image.front_view_url, front_view_url]
      left: [generate_multiview_image.left_view_url, left_view_url]
      back: [generate_multiview_image.back_view_url, back_view_url]
      right: [generate_multiview_image.right_view_url, right_view_url]
    manual:
      title: Four views of the concept (Tripo image to multiview)
      steps:
        - Download the input image below (the matted concept).
        - In Tripo Studio, open multiview generation (image to multiview) and upload it.
        - Download the front, left, back and right views.
        - Upload each into its slot here (left is the pet's own left side). The job continues once all four are in.
  multiview_to_model:
    route: POST /v3/generation/multiview-to-model
    body: {inputs: $views}
    views: [front, left, back, right]   # one slot each, null when absent; front required
    rename: {model_version: model}
    seeds: [model_seed, texture_seed]
    result: [model_url, model, pbr_model_url, pbr_model, base_model_url, base_model]
    manual:
      title: 3D model from four views (Tripo multiview to 3D)
      steps:
        - Download the view images below.
        - In Tripo Studio, open multiview to 3D and upload each view in its slot (front, left, back, right).
        - Match the settings below where Tripo Studio offers them; keep private generation on.
        - Generate, then download the model as GLB with its texture and upload it here.
