# Every model weight pinned by repo, file, revision and SHA256 (BRIEF Section 12; M2.5 GenAI profiles).
#
#   deploy_as  the name the GenAI profile uses (config/genai/*.yaml)
#   dest       path under the host's model root (ComfyUI models dir via extra_model_paths, or the shape server)
#   revision   Hugging Face commit the file is pinned to (resolved 2026-10-28)
#   sha256     the file's SHA256, or for a multi-file entry the SHA256 of its sorted "path sha256" lines. Written
#              with models.lock.json (every file's path, size and SHA256) by `scripts/models.py --pin --from-hub`
#              from Hugging Face's LFS metadata at the pinned revision; no weights are downloaded to pin.
#
# A host fetches with `make -C mac models` (Mac) or `make models` (NVIDIA): each file comes from its pinned
# revision and must match the lock byte for byte, or nothing is kept. `repo: local` entries (the S4 LoRA) are
# pinned on the host with `scripts/models.py --pin`.
models:
  - name: sdxl-base-1.0
    deploy_as: sd_xl_base_1.0.safetensors
    dest: checkpoints/sd_xl_base_1.0.safetensors
    repo: stabilityai/stable-diffusion-xl-base-1.0
