# Every model weight pinned by URL and SHA256 (BRIEF Section 12). `make models` downloads into
# ${PETPOP_MODELS:-/srv/models} and verifies; it refuses entries whose sha256 is not filled in.
# Fill sha256 on the GPU host in S3 (sha256sum after a first trusted download), then commit.
