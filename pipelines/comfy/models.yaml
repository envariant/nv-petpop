#   deploy_as  the name the GenAI profile uses (config/genai/*.yaml)
#   dest       path under the host's model root (ComfyUI models dir via extra_model_paths, or the shape server)
#   revision   Hugging Face commit the file is pinned to (resolved 2026-10-28)
#   sha256     TODO until `make -C mac models` (Mac) or `make models` (NVIDIA) downloads the file, checks it
