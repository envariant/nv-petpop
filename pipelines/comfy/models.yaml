# Ollama pulls by tag; the manifest digest (what `GET /api/tags` reports as `digest`, and the first 12 hex digits
# of `ollama list`'s ID) is pinned here and checked after every pull, so a moved tag fails the setup. Ollama
# itself checks each layer blob against the manifest while pulling. Read from registry.ollama.ai 2026-10-28.
ollama:
  - tag: qwen2.5:7b-instruct-q4_K_M
    manifest_digest: sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
    model_layer: sha256:2bada8a7450677000f678be90653b85d364de7db25eb5ea54136ada5f3933730   # 4.68 GB GGUF
    profiles: [mac-m4pro, nvidia-24gb]
